name: Docs Sync

# Publishes datasheet / schematic links for one IoTextra module:
#   1. finds the hardware revisions currently on sale (from Shopify variant SKUs),
#   2. uploads the revision PDFs from this repo to Shopify Files (PDF Title metadata set),
#   3. points the permanent short codes /d<code> and /s<code> to those files
#      (codes are never deleted or renamed, only their target changes),
#   4. writes a <!-- DOCS_START/END --> block into the product card; the module README gets
#      the Hardware Synergy and Software blocks and one line linking to the product page.
#
# Manual start only. With "apply" unchecked (default) it is a DRY RUN:
# nothing is changed, the planned card HTML / README / redirects are shown
# in the run summary and saved as an artifact.

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module folder (= Short Name), e.g. Relay2'
        type: string
        default: 'Relay2'
      apply:
        description: 'Apply changes (unchecked = dry run, nothing is changed)'
        type: boolean
        default: false

concurrency:
  group: shopify-product-sync
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pikepdf requests pyyaml

      - name: Docs sync
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.MTH_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          MODULE: ${{ inputs.module }}
          APPLY: ${{ inputs.apply }}
        run: |
          python3 << 'PYEOF'
          import os, re, glob, json, time, base64, hashlib, urllib.parse
          import requests, pikepdf, yaml

          SHOP = '55b706-7c.myshopify.com'
          STORE = 'https://makethingshappy.io'
          CDN_FILES = 'https://cdn.shopify.com/s/files/1/0860/7481/8846/files'
          API = '2026-10'
          REPO = os.environ['REPO']
          MODULE = os.environ['MODULE'].strip()
          APPLY = os.environ['APPLY'].lower() == 'true'
          GH_TOKEN = os.environ['GH_TOKEN']
          OUT = 'docs-sync-out'
          os.makedirs(OUT, exist_ok=True)
          summary = []

          def log(s=''):
              print(s)
              summary.append(s)

          def save(name, text):
              with open(os.path.join(OUT, name), 'w', encoding='utf-8') as f:
                  f.write(text)

          log(f"## Docs Sync — module `{MODULE}` — {'APPLY' if APPLY else 'DRY RUN (nothing changed)'}")

          # ---------- Shopify auth ----------
          r = requests.post(f'https://{SHOP}/admin/oauth/access_token', data={
              'grant_type': 'client_credentials',
              'client_id': os.environ['SHOPIFY_CLIENT_ID'],
              'client_secret': os.environ['SHOPIFY_CLIENT_SECRET'],
          }, timeout=60)
          r.raise_for_status()
          tok = r.json()
          TOKEN = tok['access_token']
          scopes = set((tok.get('scope') or '').split(','))
          log(f"Token scopes: `{tok.get('scope')}`")
          need = {'write_products', 'write_files', 'write_online_store_navigation'}
          if not need <= scopes:
              raise SystemExit(f"ERROR: missing scopes {sorted(need - scopes)} — approve them for the app in Shopify first.")

          def gql(query, variables=None):
              r = requests.post(f'https://{SHOP}/admin/api/{API}/graphql.json',
                                json={'query': query, 'variables': variables or {}},
                                headers={'X-Shopify-Access-Token': TOKEN}, timeout=120)
              r.raise_for_status()
              j = r.json()
              if j.get('errors'):
                  raise SystemExit(f"GraphQL error: {j['errors']}")
              return j['data']

          def user_errors(payload, what):
              errs = payload.get('userErrors') or []
              if errs:
                  raise SystemExit(f"ERROR in {what}: {errs}")

          UA = {'User-Agent': 'Mozilla/5.0 (docs-sync; +https://github.com/makethingshappy)'}

          def url_ok(url):
              for _ in range(3):
                  try:
                      r = requests.get(url, allow_redirects=True, timeout=60, stream=True, headers=UA)
                      r.close()
                      if r.status_code == 200:
                          return True
                  except requests.RequestException:
                      pass
                  time.sleep(3)
              return False

          # ---------- product ----------
          data = gql('''query($q:String!){ products(first:50, query:$q){ nodes{
              id handle title status descriptionHtml
              variants(first:100){ nodes{ sku } } } } }''',
              {'q': f'title:*IoTextra* status:active'})
          products = [p for p in data['products']['nodes']
                      if p['status'] == 'ACTIVE' and p['title'].strip().endswith(f'IoTextra {MODULE}')]
          if len(products) != 1:
              raise SystemExit(f"ERROR: expected exactly 1 active product ending with 'IoTextra {MODULE}', found {[p['title'] for p in products]}")
          product = products[0]
          log(f"Product: **{product['title']}** (`/products/{product['handle']}`)")

          # ---------- revisions on sale (from SKUs) ----------
          revs = {}
          for v in product['variants']['nodes']:
              sku = (v['sku'] or '').strip()
              if len(sku) >= 9 and sku[:9].isdigit():
                  revs.setdefault(sku[:9], []).append(sku)
              else:
                  log(f"WARNING: variant SKU `{sku}` has no product/revision code — ignored")
          if not revs:
              raise SystemExit("ERROR: no SKU with a product/revision code — nothing to publish")
          if len({c[:6] for c in revs}) != 1:
              raise SystemExit(f"ERROR: SKUs of this product carry different product codes: {sorted(revs)}")
          log(f"Revisions on sale (from SKUs): {', '.join(c[6:9] for c in sorted(revs))}")

          # ---------- redirects helpers ----------
          def get_redirect(path):
              d = gql('''query($q:String!){ urlRedirects(first:10, query:$q){ nodes{ id path target } } }''',
                      {'q': f'path:{path}'})
              for n in d['urlRedirects']['nodes']:
                  if n['path'] == path:
                      return n
              return None

          redirect_log = []

          def set_redirect(path, target):
              cur = get_redirect(path)
              redirect_log.append({'path': path, 'old_target': cur['target'] if cur else None, 'new_target': target})
              if cur and cur['target'] == target:
                  log(f"- `{path}` already → {target}")
                  return
              log(f"- `{path}`: {cur['target'] if cur else '(none)'} → {target}")
              if not APPLY:
                  return
              if cur:
                  p = gql('''mutation($id:ID!,$r:UrlRedirectInput!){ urlRedirectUpdate(id:$id, urlRedirect:$r){
                             urlRedirect{ id } userErrors{ field message } } }''',
                          {'id': cur['id'], 'r': {'target': target}})['urlRedirectUpdate']
              else:
                  p = gql('''mutation($r:UrlRedirectInput!){ urlRedirectCreate(urlRedirect:$r){
                             urlRedirect{ id } userErrors{ field message } } }''',
                          {'r': {'path': path, 'target': target}})['urlRedirectCreate']
              user_errors(p, f'redirect {path}')

          # ---------- file upload helper ----------
          def find_file(name):
              """Exact-name lookup in Shopify Files. Search first; if search finds nothing
              (its index can lag or tokenise names differently), scan the file list."""
              def match(nodes):
                  for n in nodes:
                      u = n.get('url') or ''
                      if u.split('?', 1)[0].rsplit('/', 1)[-1] == name:
                          return n
                  return None
              q = '''query($q:String!,$after:String){ files(first:100, after:$after, query:$q){
                       pageInfo{ hasNextPage endCursor }
                       nodes{ id ... on GenericFile{ url originalFileSize fileStatus } } } }'''
              for query in (f'filename:{name}', f'filename:"{name}"'):
                  n = match(gql(q, {'q': query, 'after': None})['files']['nodes'])
                  if n:
                      return n
              after = None
              seen = 0
              for _ in range(10):
                  d = gql(q, {'q': 'media_type:GenericFile', 'after': after})['files']
                  seen += len(d['nodes'])
                  n = match(d['nodes'])
                  if n:
                      log(f"  (`{name}` found by scanning the file list)")
                      return n
                  if not d['pageInfo']['hasNextPage']:
                      break
                  after = d['pageInfo']['endCursor']
              log(f"  (lookup of `{name}`: not found; this token sees {seen} files in Shopify Files)")
              return None

          def wait_ready(fid, name):
              for _ in range(60):
                  n = gql('''query($id:ID!){ node(id:$id){ ... on GenericFile{ fileStatus url } } }''', {'id': fid})['node']
                  if n and n.get('fileStatus') == 'READY' and n.get('url'):
                      return n['url']
                  if n and n.get('fileStatus') == 'FAILED':
                      raise SystemExit(f"ERROR: Shopify could not process {name}")
                  time.sleep(3)
              raise SystemExit(f"ERROR: {name} not READY in time")

          def stage(path, name):
              size = os.path.getsize(path)
              st = gql('''mutation($i:[StagedUploadInput!]!){ stagedUploadsCreate(input:$i){
                          stagedTargets{ url resourceUrl parameters{ name value } } userErrors{ field message } } }''',
                       {'i': [{'resource': 'FILE', 'filename': name, 'mimeType': 'application/pdf',
                               'httpMethod': 'POST', 'fileSize': str(size)}]})['stagedUploadsCreate']
              user_errors(st, 'stagedUploadsCreate')
              t = st['stagedTargets'][0]
              with open(path, 'rb') as f:
                  r = requests.post(t['url'], data={p['name']: p['value'] for p in t['parameters']},
                                    files={'file': (name, f, 'application/pdf')}, timeout=300)
              if r.status_code not in (200, 201, 204):
                  raise SystemExit(f"ERROR: staged upload failed {r.status_code}: {r.text[:300]}")
              return t['resourceUrl']

          def upload_pdf(src, shop_name, title, subject):
              tmp = os.path.join(OUT, shop_name)
              with pikepdf.open(src) as pdf:
                  pdf.docinfo['/Title'] = title
                  pdf.docinfo['/Author'] = 'Make Things Happy'
                  pdf.docinfo['/Subject'] = subject
                  with pdf.open_metadata(set_pikepdf_as_editor=False) as meta:
                      meta['dc:title'] = title
                      meta['dc:creator'] = ['Make Things Happy']
                      meta['dc:description'] = subject
                  pdf.Root.ViewerPreferences = pikepdf.Dictionary(DisplayDocTitle=True)
                  pdf.save(tmp, deterministic_id=True)
              size = os.path.getsize(tmp)
              existing = find_file(shop_name)
              if not APPLY:
                  state = 'new file' if not existing else ('unchanged, kept' if existing.get('originalFileSize') == size else 'content will be replaced, same URL')
                  log(f"- would upload `{os.path.relpath(src)}` as `{shop_name}` (Title: “{title}”) — {state}")
                  return None
              if existing and existing.get('originalFileSize') == size:
                  cdn = existing['url']
                  log(f"- `{shop_name}` unchanged in Shopify Files, kept")
              elif existing:
                  res = stage(tmp, shop_name)
                  fu = gql('''mutation($f:[FileUpdateInput!]!){ fileUpdate(files:$f){
                              files{ id } userErrors{ field message } } }''',
                           {'f': [{'id': existing['id'], 'originalSource': res, 'alt': title}]})['fileUpdate']
                  user_errors(fu, 'fileUpdate')
                  cdn = wait_ready(existing['id'], shop_name)
                  log(f"- `{shop_name}` content replaced (same URL)")
              else:
                  res = stage(tmp, shop_name)
                  fc = gql('''mutation($f:[FileCreateInput!]!){ fileCreate(files:$f){
                              files{ id } userErrors{ field message } } }''',
                           {'f': [{'originalSource': res, 'filename': shop_name, 'contentType': 'FILE',
                                   'duplicateResolutionMode': 'RAISE_ERROR', 'alt': title}]})['fileCreate']
                  errs = fc.get('userErrors') or []
                  if errs and all('already exists' in (e.get('message') or '') for e in errs):
                      # The file is there but could not be looked up; keep it as it is.
                      cdn = f'{CDN_FILES}/{shop_name}'
                      log(f"- WARNING: `{shop_name}` already exists in Shopify Files but could not be looked up; kept unchanged")
                  else:
                      user_errors(fc, 'fileCreate')
                      cdn = wait_ready(fc['files'][0]['id'], shop_name)
                      log(f"- `{shop_name}` uploaded")
              # The file must be reachable on Shopify's CDN.
              if not url_ok(cdn):
                  raise SystemExit(f"ERROR: uploaded file not reachable: {cdn}")
              # Shopify serves the same file on the store domain (/cdn/shop/files/...), so the PDF
              # counts for makethingshappy.io. The storefront may refuse requests from GitHub's
              # data-center IPs, so a failed check here is only reported, not acted on.
              store_url = f"{STORE}/cdn/shop/files/{cdn.split('?', 1)[0].rsplit('/files/', 1)[1]}"
              if not url_ok(store_url):
                  log(f"  note: store-domain address did not answer this runner (checked in a browser it works): {store_url}")
              log(f"  → {store_url}")
              return store_url

          def pick(paths, what, rev_dir):
              paths = sorted(paths)
              if not paths:
                  log(f"WARNING: no {what} found in `{rev_dir}`")
                  return None
              if len(paths) > 1:
                  log(f"WARNING: several {what} files in `{rev_dir}`, using `{os.path.basename(paths[0])}`")
              return paths[0]

          def find_files(folder, pattern_re):
              return [p for p in glob.glob(os.path.join(folder, '*')) if re.search(pattern_re, os.path.basename(p), re.I)]

          # ---------- document types ----------
          # One line per kind of document shown under "Links". To add a new kind
          # (e.g. a wiring diagram), add a line here; nothing else needs to change.
          #   folder  : sub-folder of the revision folder        pattern : file name regex
          #   host    : 'shopify' = uploaded to Shopify Files, reached via short code <code><SKU9>
          #             'github'  = linked to the file on GitHub
          DOC_TYPES = [
              {'key': 'pdf',       'label': 'Datasheet', 'icon': '📄', 'folder': 'docs',     'pattern': r'datasheet.*\.pdf$',            'host': 'shopify', 'code': 'd', 'expected': True},
              {'key': 'schematic', 'label': 'Schematic', 'icon': '📐', 'folder': 'hardware', 'pattern': r'schematic.*\.pdf$',           'host': 'shopify', 'code': 's', 'expected': True},
              {'key': 'pinout',    'label': 'Pinout',    'icon': '📌', 'folder': 'docs',     'pattern': r'pinout.*\.(png|jpe?g|pdf)$', 'host': 'github',  'ext': 'image'},
              {'key': 'step',      'label': '3D model',  'icon': '🧊', 'folder': 'hardware', 'pattern': r'\.ste?p$',                    'host': 'github',  'ext': 'STEP'},
          ]

          # ---------- per revision ----------
          entries = []   # (rev_label, [(text, url, icon)])
          syn_entries = []   # (rev_label, modes, {target: [SKU with exception]})
          syn_missing = []
          short = f'IoTextra {MODULE}'
          safe = MODULE.replace(' ', '-')
          for code in sorted(revs):
              vvv = code[6:9]
              rev = f'{vvv[0]}-{vvv[1:]}'          # 3-02
              dotted = f'{vvv[0]}.{vvv[1:]}'       # 3.02
              rev_dir = next((d for d in (f'{MODULE}/v{dotted}', f'{MODULE}/v.{dotted}') if os.path.isdir(d)), None)
              log(f"\n### Rev. {rev} (code `{code}`, variants: {', '.join(revs[code])})")
              if not rev_dir:
                  log(f"WARNING: no folder `{MODULE}/v{dotted}` or `{MODULE}/v.{dotted}` in the repo — skipped")
                  continue
              syn_path = f'{rev_dir}/synergy.yml'
              if os.path.isfile(syn_path):
                  with open(syn_path, encoding='utf-8') as f:
                      syn = yaml.safe_load(f) or {}
                  modes = syn.get('modes') or {}
                  for m in ('standalone', 'smart', 'mezzanine'):
                      if not (modes.get(m) or '').strip():
                          raise SystemExit(f"ERROR: `{syn_path}`: text for mode '{m}' is missing")
                  on_sale = set(revs[code])
                  exceptions = {}
                  for target in ('iotsmart_v_host', 'iotbase'):
                      mt = (syn.get('mounting') or {}).get(target) or {}
                      direct = {str(x) for x in (mt.get('direct') or [])}
                      spacer = {str(x) for x in (mt.get('spacer_or_cable') or [])}
                      both = direct & spacer
                      missing = on_sale - direct - spacer
                      if both:
                          raise SystemExit(f"ERROR: `{syn_path}`, {target}: SKU in both lists: {sorted(both)}")
                      if missing:
                          raise SystemExit(f"ERROR: `{syn_path}`, {target}: SKU on sale not listed in direct or spacer_or_cable: {sorted(missing)}")
                      extra = (direct | spacer) - on_sale
                      if extra:
                          log(f"- note: `{syn_path}`, {target}: listed but not on sale (ignored): {sorted(extra)}")
                      exceptions[target] = [x for x in revs[code] if x in spacer]
                  syn_entries.append((rev, modes, exceptions))
                  log(f"- Hardware Synergy from `{syn_path}`: Smart exceptions {exceptions['iotsmart_v_host'] or 'none'}, Mezzanine exceptions {exceptions['iotbase'] or 'none'}")
              else:
                  syn_missing.append(rev)
                  log(f"WARNING: no `{syn_path}` — Hardware Synergy block not generated")

              links = []
              for t in DOC_TYPES:
                  folder = f"{rev_dir}/{t['folder']}"
                  found = find_files(folder, t['pattern'])
                  if not found:
                      if t.get('expected'):
                          log(f"WARNING: no {t['label']} found in `{folder}`")
                      continue
                  src = pick(found, t['label'], folder)
                  text = f"{short} {t['label']}, Rev. {rev}"
                  if t['host'] == 'shopify':
                      url = upload_pdf(src, f"IoTextra-{safe}-{t['label'].replace(' ', '-')}-Rev{rev}.pdf", text, product['title'])
                      path = f"/{t['code']}{code}"
                      if APPLY:
                          set_redirect(path, url)
                      else:
                          cur = get_redirect(path)
                          redirect_log.append({'path': path, 'old_target': cur['target'] if cur else None, 'new_target': '(Shopify file URL after upload)'})
                          log(f"- `{path}` currently → {cur['target'] if cur else '(none)'}; will point to the uploaded file")
                      links.append((f'{text} (PDF)', f'{STORE}{path}', t['key']))
                  else:
                      gh = f'https://github.com/{REPO}/blob/main/' + urllib.parse.quote(src)
                      links.append((f"{text} ({t['ext']}) on GitHub", gh, t['key']))

              gpath = f'/g{code}'
              gtarget = f'https://github.com/{REPO}/tree/main/' + urllib.parse.quote(rev_dir)
              if get_redirect(gpath) is None:
                  set_redirect(gpath, gtarget)     # create only; an existing /g code is left untouched
              links.append((f'{short} Rev. {rev} on GitHub', f'{STORE}{gpath}', 'github'))
              entries.append((rev, links))

          if not entries:
              raise SystemExit("ERROR: nothing to publish")

          # ---------- Software: pills + "Software" block, from the compatibility tables ----------
          # Source of truth: the tables in makethingshappy/.github. Pills keep their short
          # names; the "Software" block below them gives the module-specific links.
          TABLES = 'https://raw.githubusercontent.com/makethingshappy/.github/main/IOTEXTRA_{}_COMPATIBILITY.md'
          FONT = "font-family: 'Roboto Condensed',sans-serif; font-size: 15px; color: #333333;"

          def table_row(kind):
              try:
                  r = requests.get(TABLES.format(kind), timeout=60)
                  r.raise_for_status()
              except requests.RequestException as e:
                  raise SystemExit(f"ERROR: cannot read the {kind} compatibility table: {e}")
              header, row = None, None
              for line in r.text.splitlines():
                  if not line.startswith('|'):
                      continue
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if cells and cells[0] == 'IoTextra Module':
                      header = cells
                  elif header and cells and (cells[0] == MODULE or cells[0].startswith(MODULE + ' v')):
                      row = cells
                      break
              if not row:
                  return []
              out = []
              for col, cell in zip(header[1:], row[1:]):
                  urls = re.findall(r'\]\((https?://[^)\s]+)\)', cell)
                  if urls:
                      out.append((col, urls[-1]))
              return out

          nodered = dict(table_row('NODERED'))
          tasmota = table_row('TASMOTA')
          esphome = table_row('ESPHOME')
          SW = []   # (pill, color, [(text, url)]) — the pill is also the card title
          if nodered.get('Node-RED'):
              SW.append(('Node-RED', '#8f0000', [(f'{short} Node-RED example flow', nodered['Node-RED'])]))
              SW.append(('MQTT', '#0c447c', [(f'{short} MQTT example (Node-RED flow)', nodered['Node-RED'])]))
          if nodered.get('Blynk'):
              SW.append(('Blynk', '#007a4a', [(f'{short} Node-RED + Blynk example flow', nodered['Blynk'])]))
          if tasmota:
              SW.append(('Tasmota', '#d4680a', [(f'{short} Tasmota template for {col}', u) for col, u in tasmota]))
          if esphome:
              SW.append(('Home Assistant', '#0d7ab5', [(f'{short} ESPHome config for {col}', u) for col, u in esphome]))

          def anchor(name):
              return 'sw-' + re.sub(r'[^a-z0-9]+', '-', name.lower()).strip('-')

          # Section headings of the generated blocks (Hardware Synergy, Software, Links)
          def h2(text):
              return (f'<h2 style="font-family: \'Roboto Condensed\',sans-serif; font-size: 22px; font-weight: 700; '
                      f'color: #111111; line-height: 1.3; margin: 28px 0 12px;">{text}</h2>')
          log(f"\n### Software (from the compatibility tables)\n- pills: {', '.join(x[0] for x in SW) or 'none'}")

          PILL = ("flex: 0 1 auto; white-space: nowrap; color: #ffffff !important; font-weight: 600; border-radius: 999px; "
                  "font-size: clamp(8px, 2.4cqi, 16px); padding: 0.7em 1.3em; line-height: 1; "
                  "font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;")
          PILL_CSS = ('<style>.mth-pill{transition: background-color .2s;}'
                      '.mth-pill:hover,.mth-pill:focus{background-color: #fb9a63 !important;}</style>')
          badges_html = (PILL_CSS + '<div data-docs-sync="badges" style="container-type: inline-size; width: 100%; max-width: 760px; margin: 8px 0;">'
                         '<div style="display: flex; flex-wrap: nowrap; gap: 1.2cqi; align-items: center;">'
                         + ''.join(f'<a class="mth-pill" href="#{anchor(n)}" style="{PILL} background: {c}; text-decoration: none;">{n}</a>' for n, c, _ in SW)
                         + '</div></div>') if SW else ''

          HEAD_PILL = ("display: inline-block; white-space: nowrap; color: #ffffff !important; font-weight: 600; border-radius: 999px; "
                       "font-size: 15px; padding: 0.6em 1.2em; line-height: 1; margin-bottom: 10px; "
                       "font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;")

          def sw_card(name, color, links):
              items = ('<ul style="margin: 0; padding-left: 18px; list-style: disc; line-height: 1.6;">\n'
                       + '\n'.join(f'<li><a href="{u}" target="_blank">{t}</a></li>' for t, u in links) + '\n</ul>')
              return (f'<div id="{anchor(name)}" style="flex: 1; min-width: 200px; background: #f7f9fc; border-radius: 8px; '
                      f'padding: 16px; scroll-margin-top: 90px; {FONT}">\n'
                      f'<div><span style="{HEAD_PILL} background: {color};">{name}</span></div>\n{items}</div>')

          software_html = (h2('Software') + '\n'
                           '<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">\n'
                           + '\n'.join(sw_card(*x) for x in SW) + '\n</div>') if SW else ''

          def shield(label, color):
              return f'![{label}](https://img.shields.io/badge/{label.replace("-", "--").replace(" ", "%20")}-{color.lstrip("#")})'
          badges_md = ('<!-- docs-sync:badges -->\n' + ' '.join(f'[{shield(n, c)}](#software)' for n, c, _ in SW)) if SW else ''
          software_md = ''
          if SW:
              md = ['## Software', '']
              for name, color, links in SW:
                  md.append(shield(name, color))
                  md += [f'- [{t}]({u})' for t, u in links]
                  md.append('')
              software_md = '<!-- SOFTWARE_START -->\n' + '\n'.join(md).rstrip() + '\n<!-- SOFTWARE_END -->'

          # ---------- DOCS block for the product card ----------
          # Same look as the hand-written "Operation Modes" block: a bold title, then light
          # cards with an emoji icon, a short label and the descriptive link. Any number of
          # cards; they wrap on narrow screens.
          ICON = {t['key']: t['icon'] for t in DOC_TYPES}
          ICON['github'] = '💻'
          LABEL = {t['key']: t['label'] for t in DOC_TYPES}
          LABEL['github'] = 'GitHub'
          FONT = "font-family: 'Roboto Condensed',sans-serif; font-size: 15px; color: #333333;"

          def card(text, url, kind):
              return (f'<div style="flex: 1; min-width: 200px; background: #f7f9fc; border-radius: 8px; padding: 16px; {FONT}">\n'
                      f'<div style="font-size: 18px; margin-bottom: 6px;">{ICON[kind]} <strong>{LABEL[kind]}</strong>\n</div>\n'
                      f'<a href="{url}" target="_blank">{text}</a></div>')

          all_links = [l for _, links in entries for l in links]
          docs_html = (h2('Links') + '\n'
                       '<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">\n'
                       + '\n'.join(card(t, u, k) for t, u, k in all_links) + '\n</div>')

          body = product['descriptionHtml']
          save('card_before.html', body)
          new_body = body

          # ---------- Hardware Synergy block (from synergy.yml) ----------
          # Replaces the former "Operation Modes" block, in the same place and the same look.
          EXC = 'can be installed only with a spacer (Height Extender) or via a cable connection.'
          MODE_UI = [('standalone', '🔌', 'Standalone', None, None),
                     ('smart', '🧠', 'Smart', 'iotsmart_v_host', ('IoTsmart', 'https://makethingshappy.io/collections/iotsmart')),
                     ('mezzanine', '🏗', 'Mezzanine', 'iotbase', ('IoTbase', 'https://makethingshappy.io/collections/iotbase'))]

          def mode_card(modes, exceptions, key, icon, title, target, link):
              text = ' '.join((modes.get(key) or '').split())
              if link and link[0] in text:   # keep the internal link to the collection
                  text = text.replace(link[0], f'<a href="{link[1]}"><strong>{link[0]}</strong></a>', 1)
              exc = ''
              if target and exceptions.get(target):
                  exc = (f'\n<div style="margin-top: 8px; font-size: 14px; color: #666666; font-style: italic;">'
                         f'Exception: SKU {", ".join(exceptions[target])} {EXC}</div>')
              return (f'<div style="flex: 1; min-width: 200px; background: #f7f9fc; border-radius: 8px; padding: 16px; {FONT}">\n'
                      f'<div style="font-size: 18px; margin-bottom: 6px;">{icon} <strong>{title}</strong>\n</div>\n'
                      f'{text}{exc}</div>')

          syn_md = ''
          if syn_entries and not syn_missing:
              parts = [h2('Hardware Synergy')]
              md = ['## Hardware Synergy', '']
              for rev, modes, exceptions in syn_entries:
                  if len(syn_entries) > 1:
                      parts.append(f'<p style="{FONT} margin: 8px 0 4px;"><strong>Rev. {rev}</strong></p>')
                      md += [f'**Rev. {rev}**', '']
                  parts.append('<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">\n'
                               + '\n'.join(mode_card(modes, exceptions, *u) for u in MODE_UI) + '\n</div>')
                  for key, icon, title, target, _ in MODE_UI:
                      line = f"{icon} **{title}:** {' '.join((modes.get(key) or '').split())}"
                      if target and exceptions.get(target):
                          line += f"<br>\n*Exception: SKU {', '.join(exceptions[target])} {EXC}*"
                      md += [line, '']
                  md.append('')
              syn_html = '\n'.join(parts)
              syn_block = f'<!-- SYNERGY_START -->\n{syn_html}\n<!-- SYNERGY_END -->'
              syn_md = '<!-- SYNERGY_START -->\n' + '\n'.join(md).rstrip() + '\n<!-- SYNERGY_END -->'
              if '<!-- SYNERGY_START -->' in new_body:
                  new_body = re.sub(r'<!-- SYNERGY_START -->.*?<!-- SYNERGY_END -->', lambda m: syn_block, new_body, flags=re.S)
              elif '<!-- MODES_START -->' in new_body:
                  new_body = re.sub(r'<!-- MODES_START -->.*?<!-- MODES_END -->', lambda m: syn_block, new_body, flags=re.S)
              elif '<!-- DOCS_START -->' in new_body:
                  new_body = new_body.replace('<!-- DOCS_START -->', syn_block + '\n<!-- DOCS_START -->', 1)
              else:
                  new_body = new_body.rstrip() + '\n' + syn_block
              # Remove the former hand-written "Hardware Synergy:" paragraph and the "Note:" line
              # right after it — only on an exact structural match; otherwise report and leave it.
              old_para = re.compile(r'\n?<p[^>]*>\s*<strong>Hardware Synergy:</strong>(?:(?!</p>).)*</p>'
                                    r'(?:\s*<p[^>]*>\s*Note:(?:(?!</p>).)*</p>)?', re.S)
              found = old_para.findall(new_body)
              if len(found) == 1:
                  save('removed_old_hardware_synergy.html', found[0])
                  new_body = old_para.sub('', new_body, count=1)
                  log('- former "Hardware Synergy:" paragraph removed (saved in the artifact)')
              elif len(found) > 1:
                  log('- WARNING: several "Hardware Synergy:" paragraphs found — left untouched, remove by hand')
              elif 'Hardware Synergy:' in new_body:
                  log('- WARNING: a "Hardware Synergy:" text was found in an unexpected form — left untouched, remove by hand')
          elif syn_missing:
              log(f"- Hardware Synergy not changed: synergy.yml missing for Rev. {', '.join(syn_missing)}")

          # ---------- hand-written section headings -> same <h2> style (once per card) ----------
          # "Key Specifications" and "Applications" written as a bold paragraph are turned into
          # the same heading as the generated blocks. Text is kept; already converted cards are
          # left as they are.
          for title in ('Key Specifications', 'Applications'):
              pat = re.compile(r'<p[^>]*>\s*<strong>\s*' + re.escape(title) + r'\s*</strong>\s*</p>')
              hits = pat.findall(new_body)
              if len(hits) == 1:
                  new_body = pat.sub(lambda m: h2(title), new_body, count=1)
                  log(f'- heading "{title}" converted to <h2>')
              elif len(hits) > 1:
                  log(f'- WARNING: several "{title}" headings — left untouched')

          # ---------- pills (inside the existing BADGES markers) ----------
          if badges_html:
              if '<!-- BADGES_START -->' in new_body:
                  new_body = re.sub(r'<!-- BADGES_START -->.*?<!-- BADGES_END -->',
                                    lambda m: f'<!-- BADGES_START -->\n{badges_html}\n<!-- BADGES_END -->', new_body, flags=re.S)
              else:
                  log('- WARNING: no BADGES markers on the card — pills not placed')

          # ---------- Software block (after Hardware Synergy, before Links) ----------
          if software_html:
              # Remove the former hand-written "Software Power:" paragraph and the list right
              # after it — only on an exact structural match; otherwise report and leave it.
              old_sw = re.compile(r'\n?<p[^>]*>\s*<strong>Software Power:</strong>(?:(?!</p>).)*</p>'
                                  r'(?:\s*<ul[^>]*>(?:(?!</ul>).)*</ul>)?', re.S)
              found = old_sw.findall(new_body)
              if len(found) == 1:
                  save('removed_old_software_power.html', found[0])
                  new_body = old_sw.sub('', new_body, count=1)
                  log('- former "Software Power:" paragraph and list removed (saved in the artifact)')
              elif len(found) > 1:
                  log('- WARNING: several "Software Power:" paragraphs found — left untouched, remove by hand')
              elif 'Software Power' in new_body:
                  log('- WARNING: a "Software Power" text was found in an unexpected form — left untouched, remove by hand')
              sw_block = f'<!-- SOFTWARE_START -->\n{software_html}\n<!-- SOFTWARE_END -->'
              if '<!-- SOFTWARE_START -->' in new_body:
                  new_body = re.sub(r'<!-- SOFTWARE_START -->.*?<!-- SOFTWARE_END -->', lambda m: sw_block, new_body, flags=re.S)
              elif '<!-- SYNERGY_END -->' in new_body:
                  new_body = new_body.replace('<!-- SYNERGY_END -->', '<!-- SYNERGY_END -->\n' + sw_block, 1)
              elif '<!-- DOCS_START -->' in new_body:
                  new_body = new_body.replace('<!-- DOCS_START -->', sw_block + '\n<!-- DOCS_START -->', 1)
              else:
                  new_body = new_body.rstrip() + '\n' + sw_block

          # ---------- Links block ----------
          block = f'<!-- DOCS_START -->\n{docs_html}\n<!-- DOCS_END -->'
          if '<!-- DOCS_START -->' in new_body:
              new_body = re.sub(r'<!-- DOCS_START -->.*?<!-- DOCS_END -->', lambda m: block, new_body, flags=re.S)
          elif '<!-- SOFTWARE_END -->' in new_body:
              new_body = new_body.replace('<!-- SOFTWARE_END -->', '<!-- SOFTWARE_END -->\n' + block, 1)
          elif '<!-- SYNERGY_END -->' in new_body:
              new_body = new_body.replace('<!-- SYNERGY_END -->', '<!-- SYNERGY_END -->\n' + block, 1)
          elif '<!-- MODES_END -->' in new_body:
              new_body = new_body.replace('<!-- MODES_END -->', '<!-- MODES_END -->\n' + block, 1)
          else:
              new_body = new_body.rstrip() + '\n' + block
          save('card_after.html', new_body)

          # ---------- README: link to the product page ----------
          # The README carries no documentation list (the files are in the repo itself); it keeps
          # one line linking to the product page. A former DOCS block is replaced by it.
          buy_badge = 'https://img.shields.io/badge/Buy_' + short.replace(' ', '_') + '-makethingshappy.io-f87733?style=for-the-badge'
          readme_block = ('<!-- PRODUCT_START -->\n'
                          f'[![Buy {short} at makethingshappy.io]({buy_badge})]({STORE}/products/{product["handle"]})\n'
                          '<!-- PRODUCT_END -->')

          readme_path = f'{MODULE}/README.md'
          with open(readme_path, encoding='utf-8') as f:
              readme = f.read()
          save('README_before.md', readme)
          if '<!-- PRODUCT_START -->' in readme:
              new_readme = re.sub(r'<!-- PRODUCT_START -->.*?<!-- PRODUCT_END -->', lambda m: readme_block, readme, flags=re.S)
          elif '<!-- DOCS_START -->' in readme:
              new_readme = re.sub(r'<!-- DOCS_START -->.*?<!-- DOCS_END -->', lambda m: readme_block, readme, flags=re.S)
          elif re.search(r'^!\[software\]\([^)]*\)[ \t]*$', readme, re.M):
              new_readme = re.sub(r'^(!\[software\]\([^)]*\))[ \t]*$', lambda m: m.group(1) + '\n\n' + readme_block, readme, count=1, flags=re.M)
          elif '<!-- OVERVIEW_END -->' in readme:
              new_readme = readme.replace('<!-- OVERVIEW_END -->', '<!-- OVERVIEW_END -->\n\n' + readme_block, 1)
          else:
              new_readme = readme_block + '\n\n' + readme
          if badges_md:
              if '<!-- docs-sync:badges -->' in new_readme:
                  new_readme = re.sub(r'<!-- docs-sync:badges -->\n[^\n]*', lambda m: badges_md, new_readme, count=1)
              elif re.search(r'^!\[software\]\([^)]*\)[ \t]*$', new_readme, re.M):
                  new_readme = re.sub(r'^!\[software\]\([^)]*\)[ \t]*$', lambda m: badges_md, new_readme, count=1, flags=re.M)
              else:
                  log('- WARNING: README has no ![software](...) line — badges not placed')
          if syn_md:
              if '<!-- SYNERGY_START -->' in new_readme:
                  new_readme = re.sub(r'<!-- SYNERGY_START -->.*?<!-- SYNERGY_END -->', lambda m: syn_md, new_readme, flags=re.S)
              else:
                  new_readme = new_readme.replace('<!-- PRODUCT_START -->', syn_md + '\n\n<!-- PRODUCT_START -->', 1)
          if software_md:
              if '<!-- SOFTWARE_START -->' in new_readme:
                  new_readme = re.sub(r'<!-- SOFTWARE_START -->.*?<!-- SOFTWARE_END -->', lambda m: software_md, new_readme, flags=re.S)
              else:
                  new_readme = new_readme.replace('<!-- PRODUCT_START -->', software_md + '\n\n<!-- PRODUCT_START -->', 1)
          # The product button goes right under the software badges, where readers look first
          if '<!-- docs-sync:badges -->' in new_readme:
              new_readme = re.sub(r'\n*<!-- PRODUCT_START -->.*?<!-- PRODUCT_END -->\n*', '\n\n', new_readme, count=1, flags=re.S)
              new_readme = re.sub(r'(<!-- docs-sync:badges -->\n[^\n]*)', lambda m: m.group(1) + '\n\n' + readme_block, new_readme, count=1)
          save('README_after.md', new_readme)
          save('redirects.json', json.dumps(redirect_log, indent=2))

          log('\n### Card DOCS block')
          log('```html\n' + docs_html + '\n```')
          log('### README product link')
          log('```markdown\n' + readme_block + '\n```')

          # ---------- apply card + README ----------
          if APPLY:
              if new_body != body:
                  p = gql('''mutation($p:ProductUpdateInput!){ productUpdate(product:$p){
                             product{ id } userErrors{ field message } } }''',
                          {'p': {'id': product['id'], 'descriptionHtml': new_body}})['productUpdate']
                  user_errors(p, 'productUpdate')
                  log('Product card updated.')
              else:
                  log('Product card already up to date.')
              if new_readme != readme:
                  h = {'Authorization': f'Bearer {GH_TOKEN}', 'Accept': 'application/vnd.github+json'}
                  api = f'https://api.github.com/repos/{REPO}/contents/' + urllib.parse.quote(readme_path)
                  sha = requests.get(api, headers=h, timeout=60).json()['sha']
                  r = requests.put(api, headers=h, timeout=60, json={
                      'message': f'Docs sync: documentation links for {MODULE}',
                      'content': base64.b64encode(new_readme.encode('utf-8')).decode('ascii'),
                      'sha': sha})
                  r.raise_for_status()
                  log('README committed.')
              else:
                  log('README already up to date.')
          else:
              log('\nDry run: no file uploaded, no redirect, card or README changed. See the artifact for full before/after.')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(summary) + '\n')
          PYEOF

      - name: Save before/after snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-sync-${{ inputs.module }}-${{ github.run_number }}
          path: docs-sync-out/
          if-no-files-found: ignore
