kind: module
product: IoTextra MOSFET2
revision: "3.02"
# Channel -> HOST line (AP0..AP7) and/or TCA9534 port bit
# active: level on the HOST line / expander bit that means "input active" or "output on"
# expander parallel: P0..P7 are wired to the same nets as AP0..AP7 (I2C optional).
#   In I2C mode the MCU must leave those AP lines as inputs (high-Z); TCA9534 powers up with all ports as inputs.
# Source: IoTextra MOSFET2 3.02 schematic
# DO1..DO4 = isolated group S, DO5..DO8 = isolated group N
expander:
  chip: TCA9534
  address: "0x20-0x27 (TCA9534) / 0x38-0x3F (TCA9534A); A2..A0 set by SW1, ON = 0"
  wiring: parallel
  int: not on HOST
channels:
  DO1: {type: mosfet, ap: AP0, bit: P0, active: low}
  DO2: {type: mosfet, ap: AP1, bit: P1, active: low}
  DO3: {type: mosfet, ap: AP2, bit: P2, active: low}
  DO4: {type: mosfet, ap: AP3, bit: P3, active: low}
  DO5: {type: mosfet, ap: AP4, bit: P4, active: low}
  DO6: {type: mosfet, ap: AP5, bit: P5, active: low}
  DO7: {type: mosfet, ap: AP6, bit: P6, active: low}
  DO8: {type: mosfet, ap: AP7, bit: P7, active: low}
